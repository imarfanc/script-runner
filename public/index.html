<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WhatsApp Sender</title>
    <link id="app-favicon" rel="icon" href="/favicon.svg">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main id="app-shell">
      <section id="composer-column" aria-label="Compose send">
        <header id="app-header">
          <h1 id="app-title">WhatsApp Sender</h1>
        </header>
        <label for="group-select">Group</label>
        <select id="group-select" aria-label="WhatsApp group"></select>
        <label for="message">Message</label>
        <textarea id="message" rows="6" placeholder="Message text (optional if a file is selected)"
          aria-label="Message"></textarea>
        <div id="file-heading">
          <p id="file-label">Attachment</p>
          <button id="browse-file" type="button">Browse…</button>
          <input id="file-browse" type="file" hidden aria-label="Choose file from disk">
        </div>
        <div id="file-list" role="listbox" aria-label="Attachment files"></div>
        <label for="send-at">Send at</label>
        <input id="send-at" type="datetime-local" aria-label="Send at">
        <button id="schedule" type="button">Schedule send</button>
        <p id="composer-error" hidden></p>
      </section>
      <section id="jobs-column" aria-label="Scheduled jobs">
        <header
          id="jobs-header"><strong>Jobs</strong><span id="jobs-hint">server sends even if this tab is closed</span></header>
        <div id="job-list" role="listbox" aria-label="Jobs"></div>
        <pre id="job-log" aria-label="Job log"></pre>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
